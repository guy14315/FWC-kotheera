<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="card.css">
    <title>Profile Card</title>
</head>

<body>

    <header>
        <h1>User Profile Card</h1>
    </header>

    <main class="card">
        <img class="avatar"
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTFhJ1CvNQJhFOGa9DsxPxRxcetkaGJ64N9pccq0moBfovZ3yr3AiNby-k&s=10"
            alt="Profile picture">

        <table class="info">
            <tr>
                <td class="label">Login</td>
                <td class="value login">kobkarn</td>
            </tr>
            <tr>
                <td class="label">About</td>
                <td class="value">42 Piscine student</td>
            </tr>
        </table>

        <div class="socials">
            <a href="https://github.com/" target="_blank" rel="noopener">
                <img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg" alt="GitHub">
            </a>
            <a href="https://twitter.com/" target="_blank" rel="noopener">
                <img src="https://upload.wikimedia.org/wikipedia/commons/6/6f/Logo_of_Twitter.svg" alt="Twitter">
            </a>
            <a href="https://linkedin.com/" target="_blank" rel="noopener">
                <img src="https://upload.wikimedia.org/wikipedia/commons/8/81/LinkedIn_icon.svg" alt="LinkedIn">
            </a>
            <a href="https://instagram.com/" target="_blank" rel="noopener">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg" alt="Instagram">
            </a>
        </div>

        <a class="contact" href="mailto:guygame97@gmail.com">Contact</a>
    </main>

</body>

</html>
