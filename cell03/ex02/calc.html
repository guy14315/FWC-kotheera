<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Calculator</title>
	<link rel="stylesheet" href="calc.css">
</head>
<body>
	<form id="calc" class="calc">
		<input type="text" id="left" class="member" placeholder="0">
		<select id="operator" class="operator">
			<option value="+">+</option>
			<option value="-">-</option>
			<option value="*">*</option>
			<option value="/">/</option>
			<option value="%">%</option>
		</select>
		<input type="text" id="right" class="member" placeholder="0">
		<input type="submit" class="submit" value="Try me!">
	</form>
	<script src="calc.js"></script>
</body>
</html>
